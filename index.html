<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>T.K Group – نظام التوزيع</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{color-scheme:light;--bg:#f1f2ee;--card:#fff;--tx:#14202a;--mut:#64707a;--bd:#d8dcd4;--gold:#c8b27a;--yel:#f5c518;--navy:#101c26;--ok:#2f9460;--err:#c0392b;--inf:#3b7dd8;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#0d151c;--card:#16222c;--tx:#e8ecee;--mut:#94a1ab;--bd:#2c3b47}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#0d151c;--card:#16222c;--tx:#e8ecee;--mut:#94a1ab;--bd:#2c3b47}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.6 Tajawal,system-ui,Arial,sans-serif}
.lg{min-height:100vh;background:radial-gradient(circle at 50% 40%,#1b2d3b,#0a121a);display:flex;align-items:center;justify-content:center;padding:20px;position:relative;overflow:hidden}
.bgs{position:absolute;inset:0;width:100%;height:100%}
.lc{position:relative;background:#101c26ee;border:1px solid #c8b27a55;border-radius:14px;padding:22px;width:min(360px,100%);color:#e8ecee;text-align:center}
.lc img{width:210px;max-width:80%;border-radius:8px}
.lc input{width:100%;margin:6px 0;padding:10px;border-radius:8px;border:1px solid #c8b27a66;background:#0a121a;color:#fff;font:inherit}
.lc small{display:block;color:#98a4ac;margin-top:10px;font-size:12.5px}
header{background:var(--navy);color:#e8ecee;display:flex;align-items:center;gap:10px;padding:8px 14px;border-bottom:3px solid var(--yel)}
header img{height:42px;border-radius:5px}header b{flex:1}
nav{display:flex;background:var(--navy)}nav button{flex:1;border:0;background:none;color:#c8b27a;font:inherit;padding:10px;border-bottom:3px solid transparent;cursor:pointer}nav button.on{color:var(--yel);border-color:var(--yel);font-weight:700}
main{max-width:1000px;margin:auto;padding:14px}
.box{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:14px;margin-bottom:14px}.box h2{margin:0 0 10px;font-size:16px}
.st{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:8px;margin-bottom:14px}
.s{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:8px;text-align:center}.s b{display:block;font-size:22px}.s span{color:var(--mut);font-size:12.5px}
.btn,button.btn{display:inline-block;background:var(--yel);color:#101c26;border:0;border-radius:8px;padding:8px 13px;font:inherit;font-weight:700;cursor:pointer;text-decoration:none;margin:3px 2px}
.g{background:transparent!important;color:var(--tx)!important;border:1px solid var(--bd)!important}.ok{background:var(--ok)!important;color:#fff!important}.er{background:var(--err)!important;color:#fff!important}.in{background:var(--inf)!important;color:#fff!important}
.drop{border:2px dashed var(--gold);border-radius:10px;padding:18px;text-align:center;color:var(--mut);cursor:pointer}
.tw{overflow-x:auto}table{width:100%;border-collapse:collapse;font-size:13.5px;min-width:640px}th,td{text-align:right;padding:6px;border-bottom:1px solid var(--bd);vertical-align:top}th{color:var(--mut);font-weight:500}
.tag{display:inline-block;padding:1px 9px;border-radius:99px;font-size:12px;font-weight:700;color:#fff;background:#8a949b}.assigned{background:var(--inf)}.onway{background:#d98200}.done{background:var(--ok)}.fail{background:var(--err)}.pickup{background:#7a5bb5}
.bar{height:10px;border-radius:6px;background:var(--bd);overflow:hidden}.bar i{display:block;height:100%;background:var(--ok)}.bar i.w{background:var(--err)}
.job{border:1px solid var(--bd);border-radius:10px;padding:12px;margin-top:10px;background:var(--card)}.top{display:flex;justify-content:space-between;gap:8px}
.amt{font-size:24px;font-weight:700;color:var(--err);margin:6px 0}.amt.z{color:var(--ok);font-size:16px}.mut{color:var(--mut);font-size:13.5px}
textarea,select,input[type=text],input[type=number]{font:inherit;color:var(--tx);background:var(--bg);border:1px solid var(--bd);border-radius:8px;padding:6px 8px;max-width:100%}textarea{width:100%;margin-top:6px}
.th{height:54px;border-radius:6px;margin:4px 0;display:block}.map{width:100%;background:var(--bg);border:1px solid var(--bd);border-radius:10px}
#rep{display:none;position:fixed;inset:0;background:#fff;color:#111;overflow:auto;z-index:50;padding:18px}#rep th,#rep td{border-color:#ccc}
@media print{body>*:not(#rep){display:none!important}#rep{position:static;display:block!important}.np{display:none}}
.mk{width:26px;height:26px;border-radius:50%;background:#f5c518;color:#101c26;font:700 13px/22px system-ui;text-align:center;border:2px solid #101c26;box-shadow:0 1px 4px #0006}.mk.dn{background:#2f9460;color:#fff}.mk.fl{background:#c0392b;color:#fff}.mk.w{background:#101c26;color:#f5c518;font-size:14px}.mk.d{background:#fff;font-size:15px}
body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;background:var(--bgimg) center/cover no-repeat;opacity:.09;filter:saturate(.7)}
#md{display:none;position:fixed;inset:0;background:#000b;z-index:60;overflow:auto;padding:14px}#md .box{max-width:560px;margin:8vh auto}
</style>
</head>

async function recM(){if(REC){REC.stop();return}
 try{var st=await navigator.mediaDevices.getUserMedia({audio:true}),mt=window.MediaRecorder&&MediaRecorder.isTypeSupported('audio/webm')?'audio/webm':'audio/mp4';REC=new MediaRecorder(st,{mimeType:mt});RCH=[];
  REC.ondataavailable=function(e){RCH.push(e.data)};
  REC.onstop=async function(){st.getTracks().forEach(function(t){t.stop()});var bl=new Blob(RCH,{type:mt});REC=null;var b=$('#rbtn');if(b)b.textContent='🎤';await upMsg(bl,mt=='audio/webm'?'webm':'m4a',mt,'audio')};
  REC.start();$('#rbtn').textContent='⏹ إيقاف وإرسال'}catch(e){REC=null;alert('تعذّر الوصول للمايك')}}
function sendLoc(){if(!navigator.geolocation){alert('الموقع غير مدعوم');return}navigator.geolocation.getCurrentPosition(function(g){sendRaw({body:'📍',kind:'loc',lat:g.coords.latitude,lng:g.coords.longitude})},function(){alert('تعذّر تحديد الموقع')},{enableHighAccuracy:true,timeout:15000})}
function thH(){return MS.length?MS.map(function(m){var o=m.sender_id==MYID,c,u=m.media_path?PH+E(m.media_path):'';
 if(m.kind=='image'&&u)c='<a href="'+u+'" target="_blank" rel="noopener"><img src="'+u+'" style="max-width:100%;border-radius:8px"></a>';
 else if(m.kind=='audio'&&u)c='<audio controls preload="none" src="'+u+'" style="max-width:100%"></audio>';
 else if(m.kind=='loc')c='<a target="_blank" rel="noopener" href="https://www.google.com/maps/search/?api=1&query='+m.lat+','+m.lng+'">📍 الموقع الحالي</a>';
 else c=E(m.body);
 return '<div style="display:flex;justify-content:'+(o?'flex-start':'flex-end')+';margin:4px 0"><div style="max-width:80%;padding:6px 10px;border-radius:12px;background:'+(o?'var(--yel)':'var(--bd)')+';color:'+(o?'#101c26':'var(--tx)')+'">'+c+'<div style="font-size:11px;opacity:.7">'+new Date(m.created_at).toLocaleTimeString('de-DE',{hour:'2-digit',minute:'2-digit'})+'</div></div></div>'}).join(''):'<div class="mut">لا توجد رسائل بعد</div>'}
var chatH0=chatH;chatH=function(){var b='<button class="btn" onclick="sendM()">إرسال</button>';
 return chatH0().replace('display:flex;gap:6px;margin-top:8px','display:flex;flex-wrap:wrap;gap:6px;margin-top:8px').split(b).join(b+'<button class="btn g" id="rbtn" onclick="recM()">'+(REC?'⏹ إيقاف وإرسال':'🎤')+'</button><label class="btn g">📷<input type="file" accept="image/*" hidden onchange="sendImg(this)"></label><button class="btn g" onclick="sendLoc()">📍</button>')};

/* ---- الأرشيف: حفظ الرحلة مع جولاتها + حذف من الأرشيف ---- */
async function arcTrip(){var n=tf;if(!n||!TID[n])return;var u=P.filter(function(p){return p.trip==n&&['new','assigned','onway'].indexOf(p.st)>-1}).length;
 if(!confirm('حفظ رحلة '+n+' مع جولاتها بالأرشيف؟'+(u?'\nفيها '+u+' طرد لسا ما انسلّم.':'')))return;
 var r=await sb.from('trips').update({archived_at:new Date().toISOString()}).eq('id',TID[n]);if(r.error){alert(r.error.message);return}tf='';await load();R()}

/* حذف الرحلة النشطة = تنحذف هي فقط، الأرشيف ما يتأثر */
async function delT(fa){var n=fa?av:tf;if(!n||!TID[n])return;
 if(!confirm('حذف رحلة '+n+' نهائياً مع كل طرودها وصورها'+(fa?' وجولاتها من الأرشيف':'')+'؟ لا يمكن التراجع.'))return;if(!confirm('تأكيد أخير: حذف رحلة '+n+'؟'))return;
 var ps=(fa?AR:P).filter(function(p){return p.trip==n&&p.ph}).map(function(p){return p.ph.replace(PH,'')});
 var r=await sb.from('trips').delete().eq('id',TID[n]);if(r.error){alert(r.error.message);return}
 if(ps.length)try{await sb.storage.from('delivery-photos').remove(ps)}catch(e){}
 if(fa)av='';tf='';await load();R()}
function delArc(n){av=n;delT(true)}

/* أرشيف الرحلات: زر حذف على كل رحلة */
var arcH0=arcH;arcH=function(){return arcH0().replace(/<button class="btn" data-n="([^"]*)" onclick="[^"]*">فتح<\/button>/g,function(m,n){return m+'<button class="btn er" data-n="'+n+'" onclick="delArc(this.dataset.n)">حذف</button>'})};

/* أرشيف الجولات: جولات الرحلات المحفوظة فقط + زر حذف لكل جولة */
function gH(){var L=RR.filter(function(r){var t=trNo(r.trip_id);return t&&TR[t]&&TR[t].archived_at}).sort(function(a,b){return a.returned_at<b.returned_at?1:-1});
 return '<div class="box"><h2>أرشيف الجولات</h2><div class="mut">'+L.length+' جولة محفوظة (تظهر هنا بعد حفظ الرحلة بالأرشيف)</div></div>'+L.map(function(r){var v=V.findIndex(function(x){return x.id==r.vehicle_id}),t=trNo(r.trip_id),G=P.concat(AR).filter(function(p){return p.v===v&&p.rd==r.round&&p.trip==t&&p.st!='split'}).sort(cmp);
  return '<div class="job"><div class="top"><b>'+E((V[v]||{}).n)+' · رحلة '+E(t)+' · الجولة '+r.round+'</b><span class="mut">'+new Date(r.returned_at).toLocaleString('de-DE')+'</span></div>'+sumH(sumT(G))+'<details><summary class="btn g">عرض الطرود</summary><div class="tw"><table style="min-width:600px"><tr><th>الرمز</th><th>الاسم</th><th>كغ</th><th>التحصيل</th><th>الحالة</th></tr>'+G.map(function(p){return '<tr><td>'+E(p.code)+'</td><td>'+E(p.name)+'</td><td>'+p.w+'</td><td>'+p.collect+'</td><td><span class="tag '+p.st+'">'+S[p.st]+'</span> '+(p.pay?PY[p.pay]:'')+'</td></tr>'}).join('')+'</table></div></details>'+(r.ack_at?'<div class="mut">✓ تم الاستلام</div>':'')+'<div><button class="btn er" data-r="'+r.id+'" onclick="delRR(this.dataset.r)">حذف الجولة من الأرشيف</button></div></div>'}).join('')}
async function delRR(id){if(!confirm('حذف هالجولة من الأرشيف؟ الرحلة وطرودها بتضل.'))return;
 var r=await sb.from('round_returns').delete().eq('id',id).select();if(r.error){alert(r.error.message);return}
 if(!r.data||!r.data.length){alert('ما انحذفت. شغّل ملف tk-archive.sql في Supabase (صلاحية الحذف).');return}
 await load();R()}

/* ---- جداول الموبايل: بطاقات بدل تمرير أفقي ---- */
function lbl(){document.querySelectorAll('.tw table').forEach(function(t){var h=t.querySelector('tr');if(!h)return;var L=Array.prototype.map.call(h.children,function(c){return c.textContent.trim()});
 t.querySelectorAll('tr').forEach(function(r,i){if(!i)return;Array.prototype.forEach.call(r.children,function(c,k){if(c.tagName=='TD'&&L[k])c.setAttribute('data-label',L[k])})})})}
var R_old=R;R=function(){R_old();lbl()};
var sa0=sa;sa=function(v){sa0(v);lbl()};
